# Position.param.yaml — Matching and autofold parameters for 'Position'

schema: Position

match:
  - name
  - alias
  - weakAlias

# not `organization`: two posts of one body share it (Minister, Deputy Minister,
# Adviser to the Minister of Interior), so it is no evidence they are one post.
# A different organization still keeps two posts apart (`distinct`).

distinct:
  - organization
  - country
  - subnationalArea
  - inceptionDate
  - dissolutionDate

fold:
  - organization
  - name
