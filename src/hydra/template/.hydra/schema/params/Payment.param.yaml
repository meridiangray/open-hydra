# Payment.param.yaml — Matching and autofold parameters for 'Payment'

schema: Payment

match:
  - transactionNumber
  - sequenceNumber
  - payer
  - beneficiary
  - date
  - amount

distinct:
  - transactionNumber
  - date
  - amount

fold:
  - payer
  - beneficiary
  - payerAccount
  - beneficiaryAccount
  - contract
  - project
