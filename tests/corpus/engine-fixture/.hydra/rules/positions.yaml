# positions.yaml — the declared hierarchy for the engine fixture
# (tests/corpus/engine-fixture/collections/*.json), as an analyst defines it.
#
# An invented dataset: every name, organization and place in it is made up. It
# exists to exercise the engine (ambiguous names, the same entity in several
# collections, many placements for one person), not to describe anything.
#
# The `subject:` identity is preserved by set_declared — no need to carry it here.
#
# Positions named here REPLACE inherited relations for them. Everything is
# relational: `below:` reads "sits under". `outside: true` = attached to the
# org but outside the chain of command (never a placement target).

Undersecretary:        {below: [Leader]}
Coordinator:             {below: [Leader],
                   titles: [captain, don]}
Head of security: {below: [Leader],
                   titles: [security chief, corporate security consultant]}
Escort:         {below: [Head of security, Coordinator],
                   titles: [sentinel, handler, soldier, muscle]}
Chef:             {below: [Leader],
                   titles: [cataloguer, chef, assistant chef, lead cataloguer]}
Distributor:      {below: [Undersecretary, Crew chief],
                   titles: [dispatcher, street dispatcher, supplier, courier]}
Counsel:          {outside: true,
                   titles: [lawyer, attorney, defense counsel, outside counsel]}
Financier:        {below: [Leader],
                   titles: [treasury, treasurer, bookkeeper]}
Crew chief:       {below: [Undersecretary, Second-in-command],
                   titles: [chief]}            # inherited said [Second-in-command]
Member:           {below: [Crew chief, Head of security, Second-in-command]}
                                              # inherited said [Crew chief, Second-in-command]

# inside pb-dce / pb-dce-ald scope — the position graph is shared vocabulary,
# placement stays inside each node's own org
Assistant special agent in charge: {below: [Leader], titles: [asac]}
Special agent:    {below: [Assistant special agent in charge]}

