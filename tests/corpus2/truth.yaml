# Which records are the same real-world entity (ids as prefixed by the build:
# `<collection>:<local id>`). Every pair inside one cluster is a true match;
# every other pair is not. Records not listed are their own entity.
same:
  - [registry:p-elodie, leaks:p-elodie]       # accent only
  - [registry:p-juergen, leaks:p-weiss]       # German transliteration (ue, ss)
  - [registry:p-aleksei, leaks:p-voronov]     # Cyrillic name, Latin alias
  - [registry:c-holding, leaks:c-holding]     # same registration number, written two ways
  - [registry:c-ports, press:c-ports]         # accents only
